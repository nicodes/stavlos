[tools]
"python" = "3.13.11"
"go" = "1.27.3"
"go:golang.org/x/vuln/cmd/govulncheck" = "1.7.0"
"node" = "22.20.0"
"actionlint" = "1.7.12"
"shellcheck" = "0.11.0"

[env]
TOOLS_ROOT = "{{ get_env(name='TOOLS_ROOT', default=config_root ~ '/.ci-tools') }}"
GOTOOLCHAIN = "local"
PYTHONDONTWRITEBYTECODE = "1"

[tasks."install"]
run = ["python3 scripts/prepare-runtime.py", "go mod download", "npm --prefix web ci --no-audit --no-fund"]

[tasks."lint"]
run = ["bash scripts/check.sh lint", "actionlint", "shellcheck scripts/check.sh"]

[tasks."unit"]
run = "python3 \"$TOOLS_ROOT/helpers/verification.py\" test --name unit --artifact .artifacts/build -- mise run _unit"
depends = ["install"]

[tasks."build"]
run = "python3 \"$TOOLS_ROOT/helpers/verification.py\" build --name build --artifact .artifacts/build -- mise run _build"
depends = ["install"]

[tasks."artifact-check"]
run = ["python3 -c 'from pathlib import Path; import os; p=Path('\"'\"'.artifacts/build/app'\"'\"'); assert not p.is_symlink() and p.is_file() and p.stat().st_size and os.access(p,os.X_OK), '\"'\"'nonempty executable artifact required'\"'\"''"]
depends = ["build"]

[tasks."clean"]
run = ["python3 -c 'import shutil; [shutil.rmtree(p,ignore_errors=True) for p in (\"dist\",\".artifacts\",\"web/node_modules\")]'"]

[tasks."test-stability"]
run = ["go test -race -count=3 ./..."]

[tasks."_build"]
run = ["bash scripts/check.sh build"]
hide = true

[tasks."_unit"]
run = ["python3 scripts/check_gate_test.py", "bash scripts/check.sh test"]
hide = true

[tasks."_test-stages"]
run = [{"task" = "unit"}]
hide = true

[tasks."test"]
run = "python3 \"$TOOLS_ROOT/helpers/verification.py\" session --test unit -- mise run _test-stages"

[tasks."_check-stages"]
run = [{"task" = "install"}, {"task" = "lint"}, {"task" = "unit"}, {"task" = "artifact-check"}]
hide = true

[tasks."check"]
run = "python3 \"$TOOLS_ROOT/helpers/verification.py\" session --test unit -- mise run _check-stages"
