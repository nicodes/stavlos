[tools]
"python" = "3.13.11"
"rust" = "1.94.0"
"trivy" = "0.74.0"
"node" = "22.20.0"
"actionlint" = "1.7.12"
"shellcheck" = "0.11.0"

[env]
TOOLS_ROOT = "{{ get_env(name='TOOLS_ROOT', default=config_root ~ '/.ci-tools') }}"
PYTHONDONTWRITEBYTECODE = "1"
CARGO_TARGET_DIR = "{{ config_root }}/.artifacts/cargo-target"

[tasks."install"]
run = ["rustup component add --toolchain 1.94.0 rustfmt clippy", "python3 scripts/prepare-runtime.py", "npm --prefix app ci --no-audit --no-fund", "npm --prefix app run build --silent"]

[tasks."lint"]
run = "bash scripts/check.sh lint"

[tasks."unit"]
run = "python3 \"$TOOLS_ROOT/helpers/verification.py\" test --name unit --artifact .artifacts/build -- mise run _unit"
depends = ["install"]

[tasks."build"]
run = "python3 \"$TOOLS_ROOT/helpers/verification.py\" build --name build --artifact .artifacts/build -- mise run _build"
depends = ["install"]

[tasks."artifact-check"]
run = ["python3 -c 'from pathlib import Path; import os; p=Path('\"'\"'.artifacts/build/app'\"'\"'); assert not p.is_symlink() and p.is_file() and p.stat().st_size and os.access(p,os.X_OK), '\"'\"'nonempty executable artifact required'\"'\"''"]
depends = ["build"]

[tasks."clean"]
run = "python3 \"$TOOLS_ROOT/helpers/clean.py\" --path dist --path target --path .artifacts/build --path .artifacts/rust-target --path .artifacts/advisory-db --path .artifacts/ui --path app/node_modules"

[tasks."test-stability"]
run = ["cargo test --locked", "cargo test --locked --manifest-path crates/api/Cargo.toml"]

[tasks."_build"]
run = ["bash scripts/check.sh build"]
hide = true

[tasks."_unit"]
run = "bash scripts/check.sh test"
hide = true

[tasks."_test-stages"]
run = [{"task" = "unit"}]
hide = true

[tasks."test"]
run = "python3 \"$TOOLS_ROOT/helpers/verification.py\" session --test unit -- mise run _test-stages"

[tasks."_check-stages"]
run = [{"task" = "install"}, {"task" = "lint"}, {"task" = "unit"}, {"task" = "artifact-check"}]
hide = true

[tasks."check"]
run = "python3 \"$TOOLS_ROOT/helpers/verification.py\" session --test unit -- mise run _check-stages"
