[package]
name = "stavlos-api"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
publish = false

[dependencies]
axum = { version = "=0.8.9", features = ["ws"] }
base64 = "0.22"
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
data-encoding = "2"
flate2 = "1"
form_urlencoded = "1"
futures-util = "0.3"
getrandom = "0.4"
hmac = "0.12"
http-body = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["http1", "tokio", "service"] }
libc = "0.2"
regex = "1"
rusqlite = { version = "0.41.1", features = ["bundled", "hooks"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "net", "sync", "time", "io-util", "io-std", "fs", "process"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
tokio-tungstenite = "0.29"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
