[package]
name = "stavlos"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
publish = false

[workspace]
exclude = ["api"]

[dependencies]
anyhow = "1"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
fs2 = "0.4"
libc = "0.2"
regex = "1"
rusqlite = { version = "0.41.1", features = ["bundled", "hooks"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
serde_yaml_ng = "0.10"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "net", "sync", "time", "io-util", "fs", "process"] }
uuid = { version = "1", features = ["v4"] }
yaml-edit = "0.3.2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
