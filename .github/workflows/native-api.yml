name: "Native executables"
'on':
  workflow_call:
    inputs:
      version:
        type: string
        required: false
        default: devel
permissions:
  contents: read
jobs:
  native:
    name: API (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
        - runner: ubuntu-24.04
          platform: Linux_x86_64
        - runner: ubuntu-24.04-arm
          platform: Linux_arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      MISE_GITHUB_TOKEN: ${{ github.token }}
      VERSION: ${{ inputs.version }}
    steps:
    - name: Check out source
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Set up development tools
      uses: nicodes/tools/setup@1b0fc8e6c9a1e4284bcc32c0011ecdc0cd3843b7
      env:
        GH_TOKEN: ${{ github.token }}
    - name: Install static Linux linker
      if: runner.os == 'Linux'
      run: sudo apt-get update && sudo apt-get install -y --no-install-recommends musl-tools
    - name: Verify native Rust API and CLI
      run: |
        set -euo pipefail
        npm ci --prefix app --no-audit --no-fund
        npm run build --prefix app
        rustup component add --toolchain 1.94.0 rustfmt clippy
        cargo fmt --manifest-path crates/api/Cargo.toml --check
        cargo clippy --locked --manifest-path crates/api/Cargo.toml --all-targets -- -D warnings
        cargo test --locked --manifest-path crates/api/Cargo.toml
        bash scripts/build-api.sh
        bash scripts/build-cli.sh
        python3 scripts/api-smoke.py .artifacts/build/app
        python3 scripts/terminal-smoke.py .artifacts/build/app
    - name: "Upload artifacts"
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: native-api-${{ matrix.platform }}
        path: |-
          .artifacts/native-api/*
          .artifacts/native-cli/*
        if-no-files-found: error
        include-hidden-files: true
        retention-days: 7
