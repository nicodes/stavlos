name: Release
'on':
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump
        required: true
        type: choice
        options:
        - patch
        - minor
        - major
permissions: {}
concurrency: release-${{ github.repository }}
jobs:
  version:
    name: Choose release version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
    - name: Check out source
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
        persist-credentials: false
    - name: Determine release version
      id: release
      env:
        BUMP: ${{ inputs.bump }}
      run: |-
        set -euo pipefail
        if [ "$GITHUB_REF" != "refs/heads/main" ]; then
          echo 'Run releases from the main branch.' >&2
          exit 1
        fi
        git fetch --tags --force
        latest="$(git tag --list 'v[0-9]*' | sed 's/^v//' | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1 || true)"
        if [ -z "$latest" ]; then
          # The first release is 0.0.1 whatever was asked for. Under 0.x a
          # minor claims a milestone that has not happened, and a first
          # release is not the place to claim one. The bump choice starts
          # mattering once there is a tag to bump.
          version="0.0.1"
        else
          IFS=. read -r major minor patch <<< "$latest"
          case "$BUMP" in
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            patch) patch=$((patch + 1)) ;;
            *) echo "Unsupported bump: $BUMP" >&2; exit 1 ;;
          esac
          version="${major}.${minor}.${patch}"
        fi
        tag="v${version}"
        if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
          echo "Tag already exists: $tag" >&2
          exit 1
        fi
        echo "version=$version" >> "$GITHUB_OUTPUT"
        echo "tag=$tag" >> "$GITHUB_OUTPUT"
  native-api:
    name: "Build native executables"
    uses: ./.github/workflows/native-api.yml
    permissions:
      contents: read
      attestations: read
    needs: version
    with:
      version: ${{ needs.version.outputs.tag }}
  release:
    name: Release
    needs:
    - version
    - native-api
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
    - name: Check out source
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
        persist-credentials: false
    - name: Set up development tools
      uses: nicodes/tools/setup@a1c0321f3b4917a7e99eca42e241e46670f6e1e1
      env:
        GH_TOKEN: ${{ github.token }}
    - name: "Download artifacts"
      uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
      with:
        pattern: native-api-*
        path: .artifacts
        merge-multiple: true
    - name: Check project
      env:
        VERSION: ${{ needs.version.outputs.tag }}
        MISE_GITHUB_TOKEN: ${{ github.token }}
        NATIVE_CLI_ARTIFACTS: .artifacts/native-cli
      shell: bash
      run: |-
        set -euo pipefail
        mise run check
        bash scripts/build-release.sh
        python3 "$TOOLS_ROOT/scripts/cli_release.py" validate --binary stavlos --platforms linux --directory dist
        python3 scripts/api-smoke.py .artifacts/release/Linux_x86_64/stavlos
    - name: Attest build provenance
      uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
      with:
        subject-path: |
          dist/*.tar.gz
          dist/checksums.txt
    - name: Upload artifacts
      id: accepted
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: accepted-cli-${{ github.sha }}-${{ github.run_attempt }}
        path: |-
          dist/*.tar.gz
          dist/checksums.txt
        if-no-files-found: error
        retention-days: 7
    outputs:
      tag: ${{ needs.version.outputs.tag }}
      artifact-id: ${{ steps.accepted.outputs.artifact-id }}
  publish:
    name: Publish release
    needs: release
    uses: nicodes/tools/.github/workflows/cli-publish.yml@a1c0321f3b4917a7e99eca42e241e46670f6e1e1
    permissions:
      contents: write
    with:
      tools-ref: f412061a7a3f0914db9e09d1159e69504aee8706
      binary: stavlos
      platforms: linux
      tag: ${{ needs.release.outputs.tag }}
      artifact-id: ${{ needs.release.outputs.artifact-id }}
