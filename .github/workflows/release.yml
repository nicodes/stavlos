name: Release
'on':
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump
        required: true
        type: choice
        default: patch
        options:
        - patch
        - minor
        - major
permissions: {}
concurrency: release-${{ github.repository }}
jobs:
  release:
    name: Release
    uses: nicodes/tools/.github/workflows/cli-release.yml@9590742a455154ac5967a67952c5758d79d476b9
    permissions:
      contents: write
      attestations: write
      id-token: write
    with:
      tools-ref: '9590742a455154ac5967a67952c5758d79d476b9'
      bump: ${{ inputs.bump }}
      binary: stavlos
      platforms: linux
      main-package: ./cmd/stavlos
