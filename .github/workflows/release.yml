name: Release
'on':
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump
        required: true
        type: choice
        default: patch
        options:
        - patch
        - minor
        - major
permissions: {}
concurrency: release-${{ github.repository }}
jobs:
  release:
    name: Release
    uses: nicodes/tools/.github/workflows/cli-release.yml@a404cbcef2a2ccfb7a9aa1961f5d893e0c31ad42
    permissions:
      contents: write
      attestations: write
      id-token: write
    with:
      tools-ref: 'a404cbcef2a2ccfb7a9aa1961f5d893e0c31ad42'
      bump: ${{ inputs.bump }}
      binary: stavlos
      platforms: linux
      main-package: ./cmd/stavlos
