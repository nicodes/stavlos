# The gate, run for every pull request and every push to main: exactly what
# scripts/check.sh runs locally (docs/ground-up-refactor.md 0.4).
name: check
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          version: 2026.9.12
          install_args: go node python actionlint shellcheck
      - name: ripgrep (the search tools use it when present)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ripgrep
      - name: install
        run: make install
      - name: gate
        run: make check
        env:
          GOFLAGS: -p=4
