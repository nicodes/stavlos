# The gate, run for every pull request and every push to main: exactly what
# scripts/check.sh runs locally (docs/ground-up-refactor.md 0.4).
name: "Build & Test"
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  check:
    name: "Test"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: "Check out source"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: "Set up tools"
        uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        with:
          version: 2026.9.12
          install_args: go node python actionlint shellcheck
      - name: Install reviewed engineering SDK
        timeout-minutes: 5
        shell: bash
        run: mise install http:cicd-engineering
      - name: Record tested integration identity
        if: github.event_name == 'pull_request'
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          ENGINEERING="$(python3 scripts/engineering-bootstrap.py)"
          python3 "$ENGINEERING/helpers/integration-identity.py"
      - name: "Upload artifacts"
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name == 'pull_request'
        with:
          name: fleet-integration-${{ github.run_id }}-${{ github.run_attempt }}
          path: .artifacts/fleet-integration.json
          if-no-files-found: error
          retention-days: 7
      - name: Cache Go compilation
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.mise.toml', '**/go.mod', '**/go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.mise.toml', '**/go.mod', '**/go.sum') }}-
      - name: "Ripgrep (the search tools use it when present)"
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ripgrep
      - name: "Install"
        run: make install
      - name: "Gate"
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.sha }}
          GOFLAGS: -p=4
        run: make verify-changed
