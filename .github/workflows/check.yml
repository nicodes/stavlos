# The gate, run for every pull request and every push to main: exactly what
# scripts/check.sh runs locally (docs/ground-up-refactor.md 0.4).
name: "Build & Test"
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  check:
    name: "Test"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: "Check out source"
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: "Set up tools"
        uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          version: 2026.9.12
          install_args: go node python actionlint shellcheck
      - name: Install reviewed engineering SDK
        timeout-minutes: 5
        shell: bash
        run: mise install http:cicd-engineering
      - name: Record tested integration identity
        if: github.event_name == 'pull_request'
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          ENGINEERING="$(python3 scripts/engineering-bootstrap.py)"
          python3 "$ENGINEERING/helpers/integration-identity.py"
      - name: "Upload artifacts"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: github.event_name == 'pull_request'
        with:
          name: fleet-integration-${{ github.run_id }}-${{ github.run_attempt }}
          path: .artifacts/fleet-integration.json
          if-no-files-found: error
          retention-days: 7
      - name: Cache Go compilation
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.mise.toml', '**/go.mod', '**/go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.mise.toml', '**/go.mod', '**/go.sum') }}-
      - name: "Ripgrep (the search tools use it when present)"
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ripgrep
      - name: "Install"
        run: make install
      - name: "Gate"
        run: make check
        env:
          GOFLAGS: -p=4
