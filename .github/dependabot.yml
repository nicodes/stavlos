version: 2
updates:
- package-ecosystem: github-actions
  directory: /
  schedule:
    interval: weekly
    day: monday
    time: "09:50"
    timezone: Etc/UTC
  open-pull-requests-limit: 5
  cooldown:
    default-days: 3
  groups:
    routine-updates:
      patterns:
      - '*'
      exclude-patterns:
      - nicodes/tools/*
      - nicodes/cicd/*
      - nicodes/komizo-actions/*
      - aviorstudio/gdam-actions/*
      - '*clerk*'
      - '*pocketbase*'
      - '*crypto*'
      - '*jsonwebtoken*'
      - '*jose*'
      - '*oauth*'
      - '*openid*'
      - '*passport*'
      - '*bcrypt*'
      - '*argon2*'
      - '@noble/*'
      - '*prisma*'
      - '*drizzle*'
      - '*migrate*'
      update-types:
      - minor
      - patch
    managed-releases:
      patterns:
      - nicodes/tools/*
      - nicodes/cicd/*
      - nicodes/komizo-actions/*
      - aviorstudio/gdam-actions/*
      update-types:
      - minor
      - patch
    security-fixes:
      applies-to: security-updates
      patterns:
      - '*'
      exclude-patterns:
      - nicodes/tools/*
      - nicodes/cicd/*
      - nicodes/komizo-actions/*
      - aviorstudio/gdam-actions/*
      - '*clerk*'
      - '*pocketbase*'
      - '*crypto*'
      - '*jsonwebtoken*'
      - '*jose*'
      - '*oauth*'
      - '*openid*'
      - '*passport*'
      - '*bcrypt*'
      - '*argon2*'
      - '@noble/*'
      - '*prisma*'
      - '*drizzle*'
      - '*migrate*'
- package-ecosystem: cargo
  directory: /
  schedule:
    interval: weekly
    day: monday
    time: "09:50"
    timezone: Etc/UTC
  open-pull-requests-limit: 5
  groups:
    routine-updates:
      patterns: ['*']
      update-types: [minor, patch]
- package-ecosystem: cargo
  directory: /api
  schedule:
    interval: weekly
    day: monday
    time: "09:50"
    timezone: Etc/UTC
  open-pull-requests-limit: 5
  groups:
    routine-updates:
      patterns: ['*']
      update-types: [minor, patch]
- package-ecosystem: npm
  directory: /web
  schedule:
    interval: weekly
    day: monday
    time: "09:50"
    timezone: Etc/UTC
  open-pull-requests-limit: 5
  groups:
    routine-updates:
      patterns: ['*']
      update-types: [minor, patch]
